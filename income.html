<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जमा नोंदवा — UtsavHisab</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-shell" class="app-container">
        <main class="main-content">
            <header class="topbar">
                <h2>वर्गणी / देणगी नोंदवा (Record Income)</h2>
            </header>

            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <form id="incomeForm">
                    <div class="form-group">
                        <label class="form-label">रक्कम (Amount in ₹) *</label>
                        <input type="number" id="inc_amount" class="form-control" placeholder="उदा. 501" required min="1" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">देणगीदाराचे नाव (Donor Name) *</label>
                        <input type="text" id="inc_donor_name" class="form-control" placeholder="उदा. राहुल शिंदे" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">मोबाईल नंबर (WhatsApp)</label>
                        <input type="tel" id="inc_donor_phone" class="form-control" placeholder="उदा. 9876543210" pattern="[0-9]{10}" />
                    </div>

                    <div class="grid grid-2">
                        <div class="form-group">
                            <label class="form-label">वर्गणी प्रकार (Category)</label>
                            <select id="inc_category" class="form-control"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">पेमेंट पद्धत (Mode)</label>
                            <select id="inc_mode" class="form-control">
                                <option value="CASH">CASH (रोख)</option>
                                <option value="UPI">UPI / GPay / PhonePe</option>
                                <option value="BANK_TRANSFER">Bank Transfer</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">जमा खाते (Deposit Account)</label>
                        <select id="inc_account" class="form-control"></select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">टीप / शेरा (Notes)</label>
                        <input type="text" id="inc_notes" class="form-control" placeholder="उदा. इमारत विंग A/102" />
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="font-size:1.05rem; margin-top:12px;">
                        <i data-lucide="check"></i> जतन करा आणि पावती द्या
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/income.js"></script>
</body>
</html>
